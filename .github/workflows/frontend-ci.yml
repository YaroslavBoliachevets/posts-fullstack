name: Frontend CI

# 1. Триггеры: запускаем пайплайн при пуше в main или при создании Pull Request
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

jobs:
 test-frontend:
  runs-on: ubuntu-latest # Запуск на чистой виртуальной машине Linux

  steps:
   # Шаг 1: Скачиваем код репозитория на сервер GitHub
   - name: Checkout repository
     uses: actions/checkout@v4

   # Шаг 2: Устанавливаем Node.js версии 20 (и кэшируем пакеты для скорости)
   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 20
      cache: "npm"
      cache-dependency-path: posts-frontend/package-lock.json

   # Шаг 3: Переходим во фронтенд и устанавливаем зависимости
   - name: Install dependencies
     run: |
      cd posts-frontend
      npm ci

   # Шаг 4: Запускаем линтер (ESLint)
   - name: Run Linter
     run: |
      cd posts-frontend
      npm run lint

   # Шаг 5: Запускаем наши тесты Vitest (однократный прогон)
   - name: Run Unit Tests
     run: |
      cd posts-frontend
      npm run test:run
